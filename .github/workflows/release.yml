name: Release

# Tag a version (for example: git tag v1.0.0 && git push origin v1.0.0) and this
# builds the game and attaches the single self-contained HTML file to a GitHub
# Release, so anyone can download and play it offline.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for a manual release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Name the playable file
        run: cp dist/index.html "dwell-time.html"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Dwell Time ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dwell-time.html
          body: |
            A cozy-to-dark cybersecurity career simulation.

            Play online: https://cyberahmedx.github.io/dwell-time/

            Or download **dwell-time.html** below and open it in any browser. It
            is fully self-contained and runs offline, no install required.
