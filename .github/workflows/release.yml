name: Release

# Tag a version (for example: git tag v1.0.0 && git push origin v1.0.0) and this
# builds the game and attaches the single self-contained HTML file to a GitHub
# Release, so anyone can download and play it offline.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for a manual release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Name the playable file
        run: cp dist/index.html "dwell-time.html"
      - name: Build release notes from CHANGELOG.md
        run: |
          ver="${{ github.event.inputs.tag || github.ref_name }}"
          ver="${ver#v}"
          {
            echo "A cozy-to-dark cybersecurity career simulation."
            echo
            echo "Play online: https://cyberahmedx.github.io/dwell-time/"
            echo
            echo "Or download **dwell-time.html** below and open it in any browser. It is fully self-contained and runs offline, no install required."
            echo
            awk -v v="$ver" 'index($0, "## [" v "]") == 1 { g = 1; print; next } g && /^## \[/ { exit } g { print }' CHANGELOG.md
          } > notes.md
          echo "----- notes.md -----"; cat notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Dwell Time ${{ github.event.inputs.tag || github.ref_name }}
          # Body is the matching section of CHANGELOG.md (the new entry on a
          # version bump). GitHub's auto notes only list PRs, which misses
          # direct pushes to main.
          generate_release_notes: false
          files: dwell-time.html
          body_path: notes.md
