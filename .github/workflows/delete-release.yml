name: Delete release

# One-off maintenance job: delete a release and its tag. Run via the Actions
# tab (workflow_dispatch) with the tag to remove.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/release to delete (e.g. v2.2.0)"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - run: gh release delete "${{ github.event.inputs.tag }}" --cleanup-tag --yes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
